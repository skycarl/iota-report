[project]
name = "iota-report"
version = "0.1.0"
description = "Portable JSON occultation observation report: Pydantic v2 models, timing-correction engine, canonical JSON Schema, and generated TypeScript/C# types."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic[email]>=2.7",
]

[project.urls]
Homepage = "https://github.com/skycarl/iota-report"
Repository = "https://github.com/skycarl/iota-report"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iota_report"]

[dependency-groups]
dev = [
    "jsonschema>=4.21",
    "pytest>=8.4.2",
    "ruff>=0.13.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG001", # unused-function-args
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "Q", # flake8-quotes
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long, handled by formatter
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
    "UP042", # enums are intentionally (str, Enum), matching iota-hub's StarCatalog (design §A.3)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow re-exports in __init__.py

[tool.ruff.lint.isort]
known-first-party = ["iota_report"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = ["tests/"]

[tool.ty.rules]
unused-ignore-comment = "warn"

[tool.ty.terminal]
output-format = "full"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
