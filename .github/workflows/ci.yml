name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check (ty)
        run: uvx ty check
      - name: Tests
        run: uv run pytest

  drift:
    name: schema + codegen drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Sync dependencies
        run: uv sync
      - name: Regenerate schema
        run: uv run python scripts/export_schema.py
      - name: Regenerate TypeScript + C# types
        run: ./scripts/generate_types.sh
      - name: Fail on drift
        run: |
          git diff --exit-code schema/ generated/ \
            || (echo "::error::schema/ or generated/ is stale. Run scripts/export_schema.py and scripts/generate_types.sh, then commit." && exit 1)
